description:
  en:
    genericName: "Runtime Agent Control Standard"
    shortDescription: >-
      Neutral, model-agnostic protocol for representing, evaluating,
      authorizing, executing, and evidencing AI-mediated actions.
    longDescription: >-
      RACS is a standard, not a runtime. It defines the contract between
      evidence layers (BARO, Speider) and action governance layers (VAIG, REHT,
      Core). RACS owns the canonical receipt and evidence contract and answers
      the question: is this action admissible to execute under the current
      authority, policy, evidence and system state?
    features:
      - "Action envelope schema (who, what, when, why, context)"
      - "Authority, policy, and evidence context schemas"
      - "Governance evaluation, determination, and clearance schemas"
      - "Canonical receipt and immutable evidence linkage"
