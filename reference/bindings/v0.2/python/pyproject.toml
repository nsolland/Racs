[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racs-v02"
version = "0.2.0"
description = "RACS v0.2 canonical contract bindings (canonicalization kernel)"
requires-python = ">=3.11"
dependencies = ["rfc8785>=0.1.4", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/racs_v02"]
