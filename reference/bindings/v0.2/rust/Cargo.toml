[package]
name = "racs-v02"
version = "0.2.0"
edition = "2021"
description = "RACS v0.2 canonical contract bindings — canonicalization kernel (3A)"

[[bin]]
name = "racs-v02-conformance"
path = "src/bin/conformance.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
jsonschema = "0.18"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
