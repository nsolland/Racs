# RACS Policy Context Specification
# Version: Draft 0.2
#
# Identifies the policy set and exact version used for evaluation.
# Policy is data, not code — never bake policy into validators.
# Regulatory applicability is an input and never grants execution authority.

racs_spec_version: "0.2"

policy_context:
  type: object
  properties:
    policy_id:
      type: string
      description: Unique identifier for this policy context instance

    policy_set_ref:
      type: string
      description: Reference to the governing policy set

    policy_set_version:
      type: string
      description: Exact version of the policy set used

    regulatory_profiles:
      type: array
      description: Versioned legal or regulatory applicability profiles used as policy inputs
      items:
        type: object
        additionalProperties: false
        properties:
          profile_id:
            type: string
            description: Stable profile identifier, for example EU_AI_ACT_OMNIBUS_2026
          legal_act_ref:
            type: string
            description: Authoritative legal act or framework reference
          version:
            type: string
            description: Immutable profile version
          jurisdiction:
            type: string
            description: Jurisdiction in which the profile is evaluated
          effective_at:
            type: string
            format: date-time
            description: Time at which applicability was evaluated
          classification:
            type:
              - string
              - "null"
            description: Explicit system classification, such as annex_iii, annex_i, or not_applicable
          active_obligation_ids:
            type: array
            uniqueItems: true
            items:
              type: string
          evidence_refs:
            type: array
            uniqueItems: true
            items:
              type: string
          accountable_owner_ref:
            type: string
            description: Accountable legal or risk owner for the classification
          profile_digest:
            type: string
            description: Digest of the exact regulatory profile used
        required:
          - profile_id
          - legal_act_ref
          - version
          - jurisdiction
          - effective_at
          - active_obligation_ids
          - evidence_refs
          - accountable_owner_ref
          - profile_digest

    rules:
      type: array
      items:
        type: object
        properties:
          rule_id:
            type: string
            description: Identifier for this rule
          description:
            type: string
            description: Human-readable rule description
          effect:
            type: string
            enum:
              - ALLOW
              - DENY
              - REQUIRE_ELEVATION
              - REQUIRE_REVIEW
              - LOG
            description: What this rule prescribes
          conditions:
            type: object
            description: Conditions under which this rule applies
        required: [rule_id, effect]
      description: Policy rules applicable to this action

    constraints:
      type: object
      properties:
        max_risk_level:
          type: string
          enum: [low, medium, high, critical]
          description: Maximum permitted risk level
        required_authority_level:
          type: string
          description: Minimum authority level required
        time_restrictions:
          type: object
          description: Time-based constraints on execution
        jurisdiction:
          type: string
          description: Applicable jurisdiction or regulatory framework
      description: Constraints imposed by policy

    evaluation_mode:
      type: string
      enum:
        - strict
        - advisory
        - audit_only
      description: How policy violations should be treated

    valid_from:
      type: string
      format: date-time
      description: When this policy version became effective

    valid_until:
      type:
        - string
        - "null"
      format: date-time
      description: When this policy version expires

    policy_data:
      type: object
      description: |
        Arbitrary policy data payload.
        Policy is data — this field carries the actual policy content
        as structured data, not executable code.
        Implementations MUST NOT evaluate policy_data as code.
      additionalProperties: true

  required:
    - policy_id
    - policy_set_ref
    - policy_set_version
    - evaluation_mode
    - valid_from
