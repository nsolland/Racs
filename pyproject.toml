[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racs"
version = "0.1.0"
description = "REHT Action Control Standard — specification and reference implementation"
requires-python = ">=3.11"
authors = [
    {name = "VALO Research Group AS"},
]
license = {text = "Proprietary — VALO Research Group AS"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "cryptography>=42.0",
    "jsoncanon>=0.2.3",
    "jsonschema>=4.21",
    "pydantic>=2.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "rfc8785",
]

[tool.setuptools.packages.find]
include = ["validators*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
