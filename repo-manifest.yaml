# repo-manifest.yaml — canonical machine-readable repository profile
# Stable ID: valo.racs
# Defined by nsolland/Index#338 (canonical AI-first public repository architecture)
# Adopted per nsolland/Racs#64
#
# This file is the authoritative machine-readable contract for this repository.
# It MUST stay in sync with publiccode.yml and llms.txt (single source of truth
# for catalogue generation — do not maintain a second, independent inventory).

schema_version: "1.0"

identity:
  stable_id: "valo.racs"
  canonical_name: "RACS"
  full_name: "Runtime Agent Control Standard"
  purpose: >-
    Neutral, model-agnostic protocol specification for representing, evaluating,
    authorizing, executing, and evidencing AI-mediated actions. Answers the core
    question: "Is this action admissible to execute under the current authority,
    policy, evidence and system state?"
  public_url: "https://github.com/nsolland/Racs"

ownership:
  owner: "VALO Research Group"
  maintainers:
    - "nsolland"
  contact_path: "https://github.com/nsolland/Racs/issues"
  governance: "Public standard; spec changes require review and version bump."

boundaries:
  public: true
  private_core: false
  public_private_boundary: >-
    spec/ is public and normative. reference/ implementations and examples are
    public and informative unless explicitly marked. Proprietary governance
    mechanisms, runtime calibration, and internal policy live outside this repo.

maturity:
  status: "implemented"
  support: "maintained"
  normative_status: "normative"
  claims_evidence_level: "validated-reference"
  version: "0.2"

contract:
  owns:
    - "canonical receipt and evidence contract"
    - "action envelope schema"
    - "authority / policy / evidence context schemas"
    - "governance evaluation, determination, and clearance schemas"
  does_not_own:
    - "execution authority grant (REHT owns admissibility clearance)"
    - "action execution (Core owns execution)"
    - "evidence evaluation (VAIG owns evaluation)"
  mappings:
    - standard: "REHT-104"
      note: >-
        Every clearance decision MUST issue a receipt. RACS records decisions and
        effects; it does not grant clearance or execute actions. Map RACS receipt
        fields to REHT-104 evidence obligations without redefining REHT
        admissibility rules.
  invariants:
    - "Platform-local receipt objects MUST map to RACS rather than become competing standards."
    - "Receipts link proposal, evaluation, clearance, execution and outcome."
    - "Evidence integrity, provenance and immutable linkage are contract concerns."

dependencies:
  - stable_id: "valo.reht"
    relation: "consumes-admissibility"
    note: "REHT owns admissibility clearance; RACS receipt binds to REHT-104."
  - stable_id: "valo.vaig"
    relation: "consumes-evaluation"
    note: "VAIG owns evidence evaluation; RACS ingests evaluation results."
  - stable_id: "valo.core"
    relation: "consumes-execution"
    note: "Core owns execution; RACS receipt records execution outcome."
  - stable_id: "baro"
    relation: "consumes-evidence"
    note: "BARO provides observational evidence packages."

interfaces:
  - type: "spec"
    path: "spec/"
    status: "normative"
  - type: "reference-implementation"
    path: "reference/"
    languages: ["python", "rust", "typescript"]
    status: "informative"
  - type: "test-vectors"
    path: "test-vectors/"
    status: "informative"
  - type: "ci"
    path: ".github/workflows/"
    status: "informative"

security:
  contact_path: "https://github.com/nsolland/Racs/issues"
  vulnerability_reporting: "open an issue; mark security-sensitive reports private"

license:
  spdx_id: "MIT"
  url: "https://opensource.org/licenses/MIT"

non_claims:
  - "RACS is not a runtime; it is a protocol specification."
  - "RACS does not grant clearance or execute actions."
  - "RACS does not define domain-specific policy; policy is data in policy-context."
  - "RACS is vendor-neutral; it does not privilege any external proof format as governance authority."

limitations:
  - "Reference implementations are examples, not production runtimes."
  - "Baseline compliance suite (non-RACS-core) is informative and not blocking."
