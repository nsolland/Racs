name: bindings-canonical-gate

on:
  push:
    branches: ["**"]
    paths:
      - "reference/bindings/v0.2/**"
      - "test-vectors/jcs/**"
      - "test-vectors/0.2/runtime-validation/**"
      - "test-vectors/0.2/runtime-continuity/**"
      - ".github/workflows/bindings-canonical-gate.yml"
  pull_request:
    paths:
      - "reference/bindings/v0.2/**"
      - "test-vectors/jcs/**"
      - "test-vectors/0.2/runtime-validation/**"
      - "test-vectors/0.2/runtime-continuity/**"
      - ".github/workflows/bindings-canonical-gate.yml"

jobs:
  cross-language-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python binding + deps
        working-directory: reference/bindings/v0.2/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q rfc8785 pydantic pytest
          pip install -q -e .

      - name: Build Rust release
        working-directory: reference/bindings/v0.2/rust
        run: cargo build --release

      - name: Install + build TypeScript
        working-directory: reference/bindings/v0.2/typescript
        run: |
          npm install
          npm run build

      - name: Cross-language Stage 3A/3B/3C gate
        id: cross_language_gate
        continue-on-error: true
        working-directory: reference/bindings/v0.2
        shell: bash
        run: |
          set -o pipefail
          python3 gate.py 2>&1 | tee /tmp/racs-bindings-gate.log

      - name: Upload gate diagnostics
        if: steps.cross_language_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-gate-diagnostics
          path: /tmp/racs-bindings-gate.log
          if-no-files-found: error

      - name: Fail on cross-language mismatch
        if: steps.cross_language_gate.outcome == 'failure'
        run: exit 1

      - name: Per-language unit/integration tests
        id: language_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            (
              cd reference/bindings/v0.2/python
              . .venv/bin/activate
              python -m pytest tests/ -q
            ) && (
              cd reference/bindings/v0.2/rust
              cargo test --release
            ) && (
              cd reference/bindings/v0.2/typescript
              npm test
            )
          } 2>&1 | tee /tmp/racs-language-tests.log

      - name: Upload language-test diagnostics
        if: steps.language_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-language-test-diagnostics
          path: /tmp/racs-language-tests.log
          if-no-files-found: error

      - name: Fail on language-test failure
        if: steps.language_tests.outcome == 'failure'
        run: exit 1
