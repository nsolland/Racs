name: repo-profile

on:
  push:
    paths:
      - "repo-manifest.yaml"
      - "publiccode.yml"
      - "llms.txt"
      - "AGENTS.md"
      - "claimed.json"
      - "scripts/validate_repo_profile.py"
      - ".github/workflows/repo-profile.yml"
  pull_request:
    paths:
      - "repo-manifest.yaml"
      - "publiccode.yml"
      - "llms.txt"
      - "AGENTS.md"
      - "claimed.json"
      - "scripts/validate_repo_profile.py"
      - ".github/workflows/repo-profile.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate repository profile
        run: python3 scripts/validate_repo_profile.py
